name: JARVIS experimental workspace voice bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows UI pixels and real navigation
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -m pip install Pillow==11.3.0 opencv-python-headless==4.14.0.94 numpy==2.2.6
          if ($LASTEXITCODE -ne 0) { throw 'Pixel dependency failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python packaging/awareness_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Local awareness smoke failed' }
          python packaging/workspace_voice_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Workspace smoke failed' }
          python packaging/animation_benchmark.py
          if ($LASTEXITCODE -ne 0) { throw 'Animation measurement failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-workspace-voice-bridge-evidence
          path: workspace-evidence
          retention-days: 7
          if-no-files-found: error
