name: JARVIS owner fast preview build, UNGATED not candidate
'on':
  push:
    branches:
    - jarvis-voice-feedback-next
    paths:
    - '.github/workflows/*owner-fast-preview*.yml'
permissions:
  contents: read
jobs:
  original-art:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@v4
      with:
        ref: jarvis-voice-feedback-next
    - name: Restore hash-pinned recovered product source, never private data
      shell: python
      run: "import pathlib,tarfile,hashlib,json,subprocess,os\narchive=pathlib.Path('1-jarvis-owner-rebuild-14.tar.gz')\n\
        assert hashlib.sha256(archive.read_bytes()).hexdigest()=='f804c50ab873b9ab15ed9974299599772d3d9f4e4f9db1a3c13cb16506b456ba','Checkpoint\
        \ source hash mismatch'\npaths=[]\nwith tarfile.open(archive)as tar:\n for member in tar.getmembers():\n  path=pathlib.PurePosixPath(member.name)\n\
        \  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts\n  if path.parts[0]=='.github':continue\n\
        \  if member.isdir():continue\n  assert member.isfile(),'Non-regular source member rejected'\n  target=pathlib.Path(*path.parts);target.parent.mkdir(parents=True,exist_ok=True)\n\
        \  target.write_bytes(tar.extractfile(member).read());target.chmod(member.mode)\n  paths.append(path.as_posix())\nassert\
        \ 'modern-ui/src/main.tsx'in paths and 'modern-ui/regression-renderers.py'in paths\npathlib.Path('.git/recovered-product-paths.json').write_text(json.dumps(paths))\n\
        print('Exact product files restored:',len(paths),'workflows remain separate, no release assets changed')\n"
      working-directory: .
    - name: Render original pinned transparent face artwork
      run: bash modern-ui/art/render-faces.sh
    - uses: actions/upload-artifact@v4
      with:
        name: JARVIS-original-3D-face-pack
        path: modern-ui/public/faces
        retention-days: 7
        if-no-files-found: error
  embedding-runtime:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: optional-embedding
    steps:
    - uses: actions/checkout@v4
      with:
        ref: jarvis-voice-feedback-next
    - name: Restore hash-pinned recovered product source, never private data
      shell: python
      run: "import pathlib,tarfile,hashlib,json,subprocess,os\narchive=pathlib.Path('1-jarvis-owner-rebuild-14.tar.gz')\n\
        assert hashlib.sha256(archive.read_bytes()).hexdigest()=='f804c50ab873b9ab15ed9974299599772d3d9f4e4f9db1a3c13cb16506b456ba','Checkpoint\
        \ source hash mismatch'\npaths=[]\nwith tarfile.open(archive)as tar:\n for member in tar.getmembers():\n  path=pathlib.PurePosixPath(member.name)\n\
        \  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts\n  if path.parts[0]=='.github':continue\n\
        \  if member.isdir():continue\n  assert member.isfile(),'Non-regular source member rejected'\n  target=pathlib.Path(*path.parts);target.parent.mkdir(parents=True,exist_ok=True)\n\
        \  target.write_bytes(tar.extractfile(member).read());target.chmod(member.mode)\n  paths.append(path.as_posix())\nassert\
        \ 'modern-ui/src/main.tsx'in paths and 'modern-ui/regression-renderers.py'in paths\npathlib.Path('.git/recovered-product-paths.json').write_text(json.dumps(paths))\n\
        print('Exact product files restored:',len(paths),'workflows remain separate, no release assets changed')\n"
      working-directory: .
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build isolated EmbeddingGemma runtime, not working Laya interpreter
      shell: pwsh
      run: ./build-windows.ps1
    - uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Optional-EmbeddingGemma-Runtime
        path: optional-embedding/embedding-runtime
        if-no-files-found: error
        retention-days: 7
  package-preview:
    needs:
    - original-art
    - embedding-runtime
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: modern-ui
    steps:
    - uses: actions/checkout@v4
      with:
        ref: jarvis-voice-feedback-next
    - name: Restore hash-pinned recovered product source, never private data
      shell: python
      run: "import pathlib,tarfile,hashlib,json,subprocess,os\narchive=pathlib.Path('1-jarvis-owner-rebuild-14.tar.gz')\n\
        assert hashlib.sha256(archive.read_bytes()).hexdigest()=='f804c50ab873b9ab15ed9974299599772d3d9f4e4f9db1a3c13cb16506b456ba','Checkpoint\
        \ source hash mismatch'\npaths=[]\nwith tarfile.open(archive)as tar:\n for member in tar.getmembers():\n  path=pathlib.PurePosixPath(member.name)\n\
        \  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts\n  if path.parts[0]=='.github':continue\n\
        \  if member.isdir():continue\n  assert member.isfile(),'Non-regular source member rejected'\n  target=pathlib.Path(*path.parts);target.parent.mkdir(parents=True,exist_ok=True)\n\
        \  target.write_bytes(tar.extractfile(member).read());target.chmod(member.mode)\n  paths.append(path.as_posix())\nassert\
        \ 'modern-ui/src/main.tsx'in paths and 'modern-ui/regression-renderers.py'in paths\npathlib.Path('.git/recovered-product-paths.json').write_text(json.dumps(paths))\n\
        print('Exact product files restored:',len(paths),'workflows remain separate, no release assets changed')\n"
      working-directory: .
    - name: Download original rendered face pack
      uses: actions/download-artifact@v4
      with:
        name: JARVIS-original-3D-face-pack
        path: modern-ui/public/faces
    - name: Download isolated EmbeddingGemma runtime for bundled delivery
      uses: actions/download-artifact@v4
      with:
        name: JARVIS-Optional-EmbeddingGemma-Runtime
        path: modern-ui/embedding-runtime
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Backend tests
      shell: pwsh
      run: 'python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0

        if ($LASTEXITCODE -ne 0) { throw "Test dependencies failed" }

        $env:PYTHONPATH="../src"

        python -m unittest discover -s ../tests

        if ($LASTEXITCODE -ne 0) { throw "Backend tests failed" }

        '
    - name: Build Tauri Windows executable
      shell: pwsh
      run: 'python -m pip install Pillow==11.3.0 pywinauto==0.6.9

        python make-icon.py

        npm ci

        if ($LASTEXITCODE -ne 0) { throw ''Frontend dependencies failed'' }

        npm run build

        if ($LASTEXITCODE -ne 0) { throw ''Frontend build failed'' }

        npm run tauri build -- --no-bundle

        if ($LASTEXITCODE -ne 0) { throw ''Tauri shell failed'' }

        '
    - name: CPU-only speech and native persona frontend
      shell: pwsh
      run: './build-mp3.ps1

        if ($LASTEXITCODE -ne 0) { throw ''Pinned MP3 encoder source build failed'' }

        ./build-speech-native.ps1

        if ($LASTEXITCODE -ne 0) { throw ''Pinned speech native build failed'' }

        '
    - name: Package bundled local core preview, ungated owner build
      shell: pwsh
      env:
        JARVIS_PACKAGE_VOICE: '1'
        JARVIS_BUNDLE_MODELS: '1'
      run: 'python -m pip install pyinstaller==6.16.0 opencv-python==4.12.0.88 playwright==1.56.0

        if ($LASTEXITCODE -ne 0) { throw ''Packaging dependencies failed'' }

        python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

        if ($LASTEXITCODE -ne 0) { throw ''Inbuilt Laya CPU Torch failed'' }

        python -m pip install -r ../optional-laya/requirements.txt

        python -m pip install model2vec==0.9.0

        if ($LASTEXITCODE -ne 0) { throw ''Inbuilt Laya runtime dependencies failed'' }

        python prepare-bundled-models.py

        if ($LASTEXITCODE -ne 0) { throw ''Pinned bundled weights failed integrity/license preparation'' }

        python package-windows.py

        if ($LASTEXITCODE -ne 0) { throw ''Preview package failed'' }

        '
    - name: Upload ungated owner preview installer
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-OwnerFast-UNGATED-PREVIEW
        path: modern-ui/windows-portable/
        retention-days: 7
        if-no-files-found: error
