name: JARVIS modern local voice preview
on:
  workflow_dispatch:
    inputs:
      native_art_run:
        description: Prior native diagnostic run to reuse for fixture-only changes
        required: false
        type: string
      native_only:
        description: Native-only diagnostic iteration, not a shipping build
        required: false
        type: boolean
        default: false
      run_laya_windows:
        description: Build optional Windows Laya runtime and synthetic acceptance
        required: false
        type: boolean
        default: false
      run_xtts:
        description: Run optional XTTS CPU runtime import only, no model download
        required: false
        type: boolean
        default: false
      run_laya:
        description: Run optional actual Laya CPU diagnostic only, not Windows build
        required: false
        type: boolean
        default: false
      face_art_run:
        description: 'Passing original 3D face-art run ID (optional)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  dispatch-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Record actual accepted dispatch inputs
        env:
          ACCEPTED_INPUTS: ${{ toJSON(github.event.inputs) }}
          ACCEPTED_REF: ${{ github.ref }}
          ACCEPTED_SHA: ${{ github.sha }}
        run: |
          printf 'Accepted ref: %s\nAccepted SHA: %s\nAccepted inputs: %s\n' "$ACCEPTED_REF" "$ACCEPTED_SHA" "$ACCEPTED_INPUTS" | tee -a "$GITHUB_STEP_SUMMARY"
  native-iteration:
    if: ${{ inputs.native_only }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: modern-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modern-ui/package-native-diagnostic.py
      - name: Cache native shell compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            modern-ui/src-tauri/target
          key: native-${{ runner.os }}-${{ hashFiles('modern-ui/src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: native-${{ runner.os }}-${{ hashFiles('modern-ui/src-tauri/Cargo.lock') }}-
      - name: Build only actual native shell and diagnostic frozen core
        if: inputs.native_art_run == ''
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0 numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0 pywinauto==0.6.9 opencv-python==4.12.0.88 playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic dependencies failed' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependencies failed' }
          python make-icon.py
          npm run tauri build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Actual native shell failed' }
          python package-native-diagnostic.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic core freeze failed' }
      - name: Reuse exact product diagnostic core
        if: inputs.native_art_run != ''
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-NATIVE-DIAGNOSTIC-NOT-SHIPPING
          path: modern-ui/native-diagnostic
          run-id: ${{ inputs.native_art_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reused core product source fingerprint and fixture dependencies
        if: inputs.native_art_run != ''
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0 pywinauto==0.6.9
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture dependencies failed' }
          python package-native-diagnostic.py --verify-reuse
          if ($LASTEXITCODE -ne 0) { throw 'Cannot reuse changed product sources' }
      - name: Match baseline installed Obsidian host prerequisite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui-evidence | Out-Null
          python -m pip install playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Obsidian host fixture dependency failed' }
          python obsidian-host-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed Obsidian host prerequisite failed' }
      - name: ENTIRE actual Windows native smoke sequence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui-evidence | Out-Null
          $env:JARVIS_UI_EXE = (Resolve-Path 'native-diagnostic/JARVIS.exe').Path
          $env:JARVIS_DATA_DIR = Join-Path (Get-Location) 'ui-evidence/native-isolated-data'
          $env:PYTHONPATH = ''
          python native-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows native iteration failed' }
      - name: Preserve diagnostic core for fast fixture-only reruns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-NATIVE-DIAGNOSTIC-NOT-SHIPPING
          path: modern-ui/native-diagnostic
          retention-days: 2
          if-no-files-found: warn
      - name: Native iteration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Native-Iteration-Evidence
          path: modern-ui/ui-evidence
          retention-days: 7
          if-no-files-found: warn
  windows:
    needs: embedding-runtime
    if: ${{ !inputs.native_only && !inputs.run_laya && !inputs.run_xtts && !inputs.run_laya_windows }}
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: modern-ui
    steps:
      - uses: actions/checkout@v4
      - name: Download original rendered face pack
        if: inputs.face_art_run != ''
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-original-3D-face-pack
          path: modern-ui/public/faces
          run-id: ${{ inputs.face_art_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests
        shell: pwsh
        run: |
          python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2
          if ($LASTEXITCODE -ne 0) { throw "Test dependencies failed" }
          $env:PYTHONPATH="../src"
          python -m unittest discover -s ../tests
          if ($LASTEXITCODE -ne 0) { throw "Backend tests failed" }
      - name: Pinned frontend and real browser interactions
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory','dist' -PassThru
          try { node tools-launcher-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Four Tools launcher failed' }; node ui-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'UI check failed' }; node account-scroll-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Account scroll check failed' }; node semantic-search-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Semantic search renderer failed' }; node agent-creator-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Creator renderer check failed' }; node code-proposal-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Reviewed code proposal renderer failed' }; node tiny-specialist-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Tiny reviewed manual task renderer failed' }; node game-capture-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Game capture consent renderer failed' }; node strong-idle-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Strong idle consent renderer failed' }; node obsidian-auto-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Obsidian AUTO renderer failed' }; node pill-app-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Compact pill/app review renderer failed' }; node team-dialogue-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Team dialogue UI check failed' }; node laya-front-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Front Laya and LYRA consent UI failed' }; node team-browser-review-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Team browser review failed' }; node team-stream-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Team stream UI failed' }; node polish-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Startup/polish UI failed' }; node source-label-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Response provenance UI failed' }; node model-status-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Model status UI failed' }; node change-without-pause-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Cloud setup/scoped interruption UI failed' }; node local-speed-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Local speed UI check failed' }; node laya-managed-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Managed Laya renderer check failed' }; node onboarding-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Onboarding check failed' }; node expression-connected-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Expression check failed' }; node caption-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'UI smoke failed' }; if (Test-Path 'public/faces/manifest.json') { node face-pack-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Face persistence failed' }; node motion-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Motion check failed' } } } finally { Stop-Process -Id $server.Id }
      - name: New conductor handoff acceptance
        shell: pwsh
        run: |
          python night-fix-bridge-state.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual owner command bridge failed' }
          python polish-state.py
          if ($LASTEXITCODE -ne 0) { throw 'Polish actual Bridge state failed' }
          node universe-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge graph fixture failed' }
          node next-track-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Direct controls/selected screen/editable answer fixture failed' }
          node transcript-setting-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Transcript native-setting readback fixture failed' }
          node polish-pixels.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Polish pixels failed' }
          node presence-pixels.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Polish pixels failed' }
          node narrow-pixels.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Front Laya/app/support/voice checks failed' }
          node conductor-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Front conductor review failed' }
          node news-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'News review/reading renderer failed' }
          node calendar-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Calendar draft handoff failed' }
          node orientation-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Obsidian orientation failed' }
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
          $env:PYTHONPATH='../src'
          python actual-news-capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual browser news capture failed' }
      - name: Actual Obsidian native Canvas fixture
        shell: pwsh
        run: |
          python -m pip install playwright==1.56.0
          python obsidian-host-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Obsidian Canvas host failed' }
      - name: Build Tauri Windows executable
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0 pywinauto==0.6.9
          Set-Location ..
          python packaging/game_capture_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic game-window capture failed' }
          Set-Location modern-ui
          python make-icon.py
          npm run tauri build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Tauri shell failed' }
          python -m pip install Pillow==11.3.0 pywinauto==0.6.9
      - name: CPU-only speech and native persona frontend
        shell: pwsh
        run: ./build-speech-native.ps1
      - name: Download isolated EmbeddingGemma runtime for bundled delivery
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Optional-EmbeddingGemma-Runtime
          path: modern-ui/embedding-runtime
      - name: Package bundled local core and test the portable EXE
        shell: pwsh
        env:
          JARVIS_PACKAGE_VOICE: '1'
        run: |
          python -m pip install pyinstaller==6.16.0 opencv-python==4.12.0.88 playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Packaging dependencies failed' }
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'Inbuilt Laya CPU Torch failed' }
          python -m pip install -r ../optional-laya/requirements.txt
          python -m pip install model2vec==0.9.0
          if ($LASTEXITCODE -ne 0) { throw 'Inbuilt Laya runtime dependencies failed' }
          python package-windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen core acceptance failed' }
          $env:JARVIS_UI_EXE = (Resolve-Path 'windows-portable/JARVIS.exe').Path
          $env:PYTHONPATH = ''
          python native-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Tauri launch failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --voice-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen speech software chain failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --laya-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen managed Laya acceptance failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --turn-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Smart Turn acceptance failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --search-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen English search acceptance failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Voice-Preview
          path: modern-ui/windows-portable/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-modern-Voice-CI-acceptance
          path: |
            modern-ui/ui-evidence
            modern-ui/dist

          retention-days: 7
          if-no-files-found: error
  actual-laya:
    if: ${{ inputs.run_laya }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      USE_TF: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit CPU runtime only
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r diagnostics/optional-laya-requirements.txt
          python -m pip check
      - name: Actual pinned checkpoint, synthetic questions, no browser effects
        run: python diagnostics/laya-engine-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-optional-Laya-CPU-evidence
          path: optional-engine-evidence
          if-no-files-found: error
          retention-days: 7
  xtts-runtime:
    if: ${{ inputs.run_xtts }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      USE_TF: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit CPU runtime only
        run: |
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r diagnostics/optional-xtts-requirements.txt
          python -m pip check
      - name: XTTS native runtime imports only, no model download
        run: python diagnostics/xtts-runtime-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-optional-XTTS-runtime-evidence
          path: optional-engine-evidence
          if-no-files-found: error
          retention-days: 7

  windows-laya:
    if: ${{ inputs.run_laya_windows }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      USE_TF: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU runtime and build tools
        shell: pwsh
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU Torch install failed' }
          python -m pip install -r optional-laya/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Runtime dependencies failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Runtime dependency check failed' }
      - name: Package separate runtime without model weights
        run: python optional-laya/package.py
      - name: Actual frozen CPU and pinned model acceptance
        run: python optional-laya/acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-optional-Laya-Windows-runtime
          path: optional-laya/portable
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-optional-Laya-Windows-evidence
          path: |
            optional-laya/acceptance.json
            optional-laya/manifest.json
            optional-laya/server.log
          retention-days: 7
          if-no-files-found: error

  embedding-runtime:
    if: ${{ !inputs.native_only && !inputs.run_laya && !inputs.run_xtts && !inputs.run_laya_windows }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: optional-embedding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated EmbeddingGemma runtime, not working Laya interpreter
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Optional-EmbeddingGemma-Runtime
          path: optional-embedding/embedding-runtime
          if-no-files-found: error
          retention-days: 7
  embedding-model:
    if: ${{ !inputs.native_only && !inputs.run_laya && !inputs.run_xtts && !inputs.run_laya_windows }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JARVIS_DATA_DIR: /tmp/jarvis-embedding-acceptance
      HF_HUB_DISABLE_TELEMETRY: '1'
      USE_TF: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned isolated CPU inference dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r optional-embedding/requirements.txt
          python -m pip check
      - name: Real pinned model, synthetic text/code/image/video/audio candidates
        run: python optional-embedding/acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-EmbeddingGemma-Real-CPU-Evidence
          path: embedding-evidence
          if-no-files-found: error
          retention-days: 7
