name: JARVIS modern local voice preview
on:
  workflow_dispatch:
    inputs:
      assemble_tested_source:
        description: Apply hash-pinned tested product patches to integration source only, no builds or release
        required: false
        type: boolean
        default: false
      voice_device_proof:
        description: Actual Windows device attempt and public Tamil English Auto engine fixture proof only
        required: false
        type: boolean
        default: false
      managed_model_proof:
        description: Real pinned managed runtime synthetic diagnostic only, not shipping
        required: false
        type: boolean
        default: false
      stage_tested_draft:
        description: Attach verified237ZIP to existing draft only, no product rebuild or publication
        required: false
        type: boolean
        default: false
      native_art_run:
        description: Prior native diagnostic run to reuse for fixture-only changes
        required: false
        type: string
      native_only:
        description: Native-only diagnostic iteration, not a shipping build
        required: false
        type: boolean
        default: false
      run_laya_windows:
        description: Build optional Windows Laya runtime and synthetic acceptance
        required: false
        type: boolean
        default: false
      run_xtts:
        description: Run optional XTTS CPU runtime import only, no model download
        required: false
        type: boolean
        default: false
      run_laya:
        description: Run optional actual Laya CPU diagnostic only, not Windows build
        required: false
        type: boolean
        default: false
      face_art_run:
        description: 'Passing original 3D face-art run ID (optional)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  dispatch-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Record actual accepted dispatch inputs
        env:
          ACCEPTED_INPUTS: ${{ toJSON(github.event.inputs) }}
          ACCEPTED_REF: ${{ github.ref }}
          ACCEPTED_SHA: ${{ github.sha }}
        run: |
          printf 'Accepted ref: %s\nAccepted SHA: %s\nAccepted inputs: %s\n' "$ACCEPTED_REF" "$ACCEPTED_SHA" "$ACCEPTED_INPUTS" | tee -a "$GITHUB_STEP_SUMMARY"
  native-iteration:
    if: ${{ inputs.native_only && !inputs.stage_tested_draft && !inputs.managed_model_proof && !inputs.voice_device_proof && !inputs.assemble_tested_source }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: modern-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modern-ui/package-native-diagnostic.py
      - name: Cache native shell compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            modern-ui/src-tauri/target
          key: native-${{ runner.os }}-${{ hashFiles('modern-ui/src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: native-${{ runner.os }}-${{ hashFiles('modern-ui/src-tauri/Cargo.lock') }}-
      - name: Build only actual native shell and diagnostic frozen core
        if: inputs.native_art_run == ''
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0 numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0 pywinauto==0.6.9 opencv-python==4.12.0.88 playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic dependencies failed' }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependencies failed' }
          python make-icon.py
          npm run tauri build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Actual native shell failed' }
          ./build-mp3.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MP3 encoder source build failed' }
          python package-native-diagnostic.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic core freeze failed' }
      - name: Reuse exact product diagnostic core
        if: inputs.native_art_run != ''
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-NATIVE-DIAGNOSTIC-NOT-SHIPPING
          path: modern-ui/native-diagnostic
          run-id: ${{ inputs.native_art_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reused core product source fingerprint and fixture dependencies
        if: inputs.native_art_run != ''
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0 pywinauto==0.6.9
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture dependencies failed' }
          ./build-mp3.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MP3 encoder source build failed' }
          python package-native-diagnostic.py --verify-reuse
          if ($LASTEXITCODE -ne 0) { throw 'Cannot reuse changed product sources' }
      - name: Install required Brave browser for real frozen navigation acceptance
        shell: pwsh
        run: |
          choco install brave --version=1.88.134 --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Brave installation failed' }
          $env:PYTHONPATH='../src'
          python -c "from jarvis.brave_path import find_brave; print('Verified Brave executable:', find_brave())"
          if ($LASTEXITCODE -ne 0) { throw 'Required Brave executable not found' }
      - name: Match baseline installed Obsidian host prerequisite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui-evidence | Out-Null
          python -m pip install playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Obsidian host fixture dependency failed' }
          python obsidian-host-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed Obsidian host prerequisite failed' }
      - name: ENTIRE actual Windows native smoke sequence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui-evidence | Out-Null
          $env:JARVIS_UI_EXE = (Resolve-Path 'native-diagnostic/JARVIS.exe').Path
          $env:JARVIS_DATA_DIR = Join-Path (Get-Location) 'ui-evidence/native-isolated-data'
          $env:PYTHONPATH = ''
          $env:JARVIS_NATIVE_WEIGHTS_DIAGNOSTIC = '1'
          python native-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows native iteration failed' }
      - name: Actual copied Bigfoot shell navigation and responsive pixels
        shell: pwsh
        run: |
          $env:JARVIS_UI_EXE = (Resolve-Path 'native-diagnostic/JARVIS.exe').Path
          python desktop-native-proof.py
          if ($LASTEXITCODE -ne 0) { throw 'Owned actual desktop input readback failed' }
          python bigfoot-native-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual copied-shell Windows diagnostic failed' }
      - name: Preserve diagnostic core for fast fixture-only reruns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-NATIVE-DIAGNOSTIC-NOT-SHIPPING
          path: modern-ui/native-diagnostic
          retention-days: 2
          if-no-files-found: warn
      - name: Native iteration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Native-Iteration-Evidence
          path: modern-ui/ui-evidence
          retention-days: 7
          if-no-files-found: warn
  windows:
    needs: embedding-runtime
    if: ${{ !inputs.stage_tested_draft && !inputs.native_only && !inputs.run_laya && !inputs.run_xtts && !inputs.run_laya_windows && !inputs.managed_model_proof && !inputs.voice_device_proof && !inputs.assemble_tested_source }}
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: modern-ui
    steps:
      - uses: actions/checkout@v4
      - name: Download original rendered face pack
        if: inputs.face_art_run != ''
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-original-3D-face-pack
          path: modern-ui/public/faces
          run-id: ${{ inputs.face_art_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install required Brave browser for real frozen navigation acceptance
        shell: pwsh
        run: |
          choco install brave --version=1.88.134 --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Brave installation failed' }
          $env:PYTHONPATH='../src'
          python -c "from jarvis.brave_path import find_brave; print('Verified Brave executable:', find_brave())"
          if ($LASTEXITCODE -ne 0) { throw 'Required Brave executable not found' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests
        shell: pwsh
        run: |
          python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw "Test dependencies failed" }
          $env:PYTHONPATH="../src"
          python -m unittest discover -s ../tests
          if ($LASTEXITCODE -ne 0) { throw "Backend tests failed" }
      - name: Pinned frontend and real browser interactions
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
          node bigfoot-shell-preview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Faithful Bigfoot shell renderer failed' }
          node bigfoot-model-session-preview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Managed session review renderer failed' }
          node bigfoot-shortcut-preview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed hold shortcut renderer failed' }
          node bigfoot-microphone-preview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Copied microphone renderer failed' }
          node bigfoot-responsive-preview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Copied responsive renderer failed' }
          node bigfoot-speech-setup-preview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Copied speech-setup renderer failed' }
          node bigfoot-desktop-preview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Copied desktop renderer failed' }
          node bigfoot-live-voice-preview.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Copied live voice renderer failed' }
          node companion-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Bigfoot companion renderer failed' }
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory','dist' -PassThru
          python night-fix-bridge-state.py
          if ($LASTEXITCODE -ne 0) { throw 'Connection fixture bridge state failed' }
          try { node phone-handoff-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Phone unsent desktop handoff renderer failed' }; node design-draft-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Local SVG draft renderer failed' }; node calendar-telegram-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Calendar Telegram draft handoff renderer failed' }; node drive-text-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Drive exact text upload review renderer failed' }; node notion-text-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Notion exact paragraph review renderer failed' }; node sheets-write-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Sheets exact text write review renderer failed' }; node github-issue-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'GitHub issue review renderer failed' }; node source-answer-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Source answer review renderer failed' }; node phone-transport-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Phone TLS review renderer failed' }; node brain-switch-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Brain switch renderer failed' }; node watch-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Watch renderer failed' }; node reflex-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Reflex evidence renderer failed' }; node focus-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Focus timer renderer failed' }; node workspace-read-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Workspace reviewed reads renderer failed' }; node projects-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Project reviewed reads renderer failed' }; node semantic-source-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Semantic source selection renderer failed' }; node invoice-draft-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Invoice draft renderer failed' }; node telegram-output-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Telegram reviewed output renderer failed' }; node telegram-control-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Telegram private pairing renderer failed' }; node gcal-review-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Calendar exact review renderer failed' }; node gmail-review-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Gmail exact review renderer failed' }; node google-control-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Google account renderer failed' }; node phone-control-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Phone local pairing renderer failed' }; node phone-web-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Phone unpaired renderer failed' }; node phone-capture-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Phone fake-microphone capture/playback fixture failed' }; node phone-stop-race-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Phone Stop race renderer failed' }; node phone-permission-race-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Phone delayed permission ownership failed' }; node tools-launcher-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Four Tools launcher failed' }; node ui-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'UI check failed' }; node account-scroll-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Account scroll check failed' }; node semantic-search-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Semantic search renderer failed' }; node agent-creator-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Creator renderer check failed' }; node code-proposal-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Reviewed code proposal renderer failed' }; node tiny-specialist-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Tiny reviewed manual task renderer failed' }; node game-capture-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Game capture consent renderer failed' }; node strong-idle-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Strong idle consent renderer failed' }; node obsidian-auto-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Obsidian AUTO renderer failed' }; node pill-app-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Compact pill/app review renderer failed' }; node team-dialogue-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Team dialogue UI check failed' }; node laya-front-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Front Laya and LYRA consent UI failed' }; node team-browser-review-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Team browser review failed' }; node team-stream-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Team stream UI failed' }; node polish-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Startup/polish UI failed' }; node source-label-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Response provenance UI failed' }; node model-status-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Model status UI failed' }; node change-without-pause-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Cloud setup/scoped interruption UI failed' }; node local-speed-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Local speed UI check failed' }; node laya-managed-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Managed Laya renderer check failed' }; node onboarding-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Onboarding check failed' }; node expression-connected-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Expression check failed' }; node caption-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'UI smoke failed' }; if (Test-Path 'public/faces/manifest.json') { node face-pack-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Face persistence failed' }; node motion-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'Motion check failed' } } } finally { Stop-Process -Id $server.Id }
      - name: New conductor handoff acceptance
        shell: pwsh
        run: |
          python night-fix-bridge-state.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual owner command bridge failed' }
          python polish-state.py
          if ($LASTEXITCODE -ne 0) { throw 'Polish actual Bridge state failed' }
          node neural-live-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Neural live renderer failed' }
          node neural-native-audit-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Neural native audit lifecycle renderer failed' }
          node neural-native-viewport-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native viewport Master visibility renderer failed' }
          if ($LASTEXITCODE -ne 0) { throw 'Neural live motion/popup/review renderer failed' }
          node universe-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge graph fixture failed' }
          node next-track-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Direct controls/selected screen/editable answer fixture failed' }
          node transcript-setting-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Transcript native-setting readback fixture failed' }
          node polish-pixels.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Polish pixels failed' }
          node presence-pixels.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Polish pixels failed' }
          node narrow-pixels.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Front Laya/app/support/voice checks failed' }
          node conductor-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Front conductor review failed' }
          node news-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'News review/reading renderer failed' }
          node calendar-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Calendar draft handoff failed' }
          node orientation-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Obsidian orientation failed' }
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
          $env:PYTHONPATH='../src'
          python actual-news-capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual browser news capture failed' }
      - name: Actual Obsidian native Canvas fixture
        shell: pwsh
        run: |
          python -m pip install playwright==1.56.0
          python obsidian-host-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Obsidian Canvas host failed' }
      - name: Build Tauri Windows executable
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0 pywinauto==0.6.9
          Set-Location ..
          python packaging/game_capture_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic game-window capture failed' }
          Set-Location modern-ui
          python make-icon.py
          npm run tauri build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Tauri shell failed' }
          python -m pip install Pillow==11.3.0 pywinauto==0.6.9
      - name: CPU-only speech and native persona frontend
        shell: pwsh
        run: |
          ./build-mp3.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned MP3 encoder source build failed' }
          ./build-speech-native.ps1
      - name: Download isolated EmbeddingGemma runtime for bundled delivery
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Optional-EmbeddingGemma-Runtime
          path: modern-ui/embedding-runtime
      - name: Package bundled local core and test the portable EXE
        shell: pwsh
        env:
          JARVIS_PACKAGE_VOICE: '1'
          JARVIS_BUNDLE_MODELS: '1'
        run: |
          python -m pip install pyinstaller==6.16.0 opencv-python==4.12.0.88 playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Packaging dependencies failed' }
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'Inbuilt Laya CPU Torch failed' }
          python -m pip install -r ../optional-laya/requirements.txt
          python -m pip install model2vec==0.9.0
          if ($LASTEXITCODE -ne 0) { throw 'Inbuilt Laya runtime dependencies failed' }
          python prepare-bundled-models.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned bundled weights failed integrity/license preparation' }
          python package-windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen core acceptance failed' }
      - name: Preserve full built package for diagnostic acceptance retries
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-FULL-PACKAGE-DIAGNOSTIC-NOT-ACCEPTED
          path: modern-ui/windows-portable/
          retention-days: 2
          if-no-files-found: error
      - name: Accept actual portable native UI and frozen software runtimes
        shell: pwsh
        run: |
          $env:JARVIS_UI_EXE = (Resolve-Path 'windows-portable/JARVIS.exe').Path
          $env:PYTHONPATH = ''
          python native-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Tauri launch failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --voice-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen speech software chain failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --phone-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen private phone software chain failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --laya-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen managed Laya acceptance failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --turn-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Smart Turn acceptance failed' }
          & ./windows-portable/backend/jarvis-local-core.exe --search-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Frozen English search acceptance failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Voice-Preview
          path: modern-ui/windows-portable/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-modern-Voice-CI-acceptance
          path: |
            modern-ui/ui-evidence
            modern-ui/dist

          retention-days: 7
          if-no-files-found: error
  actual-laya:
    if: ${{ inputs.run_laya && !inputs.stage_tested_draft && !inputs.managed_model_proof && !inputs.voice_device_proof && !inputs.assemble_tested_source }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      USE_TF: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit CPU runtime only
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r diagnostics/optional-laya-requirements.txt
          python -m pip check
      - name: Actual pinned checkpoint, synthetic questions, no browser effects
        run: python diagnostics/laya-engine-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-optional-Laya-CPU-evidence
          path: optional-engine-evidence
          if-no-files-found: error
          retention-days: 7
  xtts-runtime:
    if: ${{ inputs.run_xtts && !inputs.stage_tested_draft && !inputs.managed_model_proof && !inputs.voice_device_proof && !inputs.assemble_tested_source }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      USE_TF: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit CPU runtime only
        run: |
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r diagnostics/optional-xtts-requirements.txt
          python -m pip check
      - name: XTTS native runtime imports only, no model download
        run: python diagnostics/xtts-runtime-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-optional-XTTS-runtime-evidence
          path: optional-engine-evidence
          if-no-files-found: error
          retention-days: 7

  windows-laya:
    if: ${{ inputs.run_laya_windows && !inputs.stage_tested_draft && !inputs.managed_model_proof && !inputs.voice_device_proof && !inputs.assemble_tested_source }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      USE_TF: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned CPU runtime and build tools
        shell: pwsh
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU Torch install failed' }
          python -m pip install -r optional-laya/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Runtime dependencies failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Runtime dependency check failed' }
      - name: Package separate runtime without model weights
        run: python optional-laya/package.py
      - name: Actual frozen CPU and pinned model acceptance
        run: python optional-laya/acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-optional-Laya-Windows-runtime
          path: optional-laya/portable
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-optional-Laya-Windows-evidence
          path: |
            optional-laya/acceptance.json
            optional-laya/manifest.json
            optional-laya/server.log
          retention-days: 7
          if-no-files-found: error

  embedding-runtime:
    if: ${{ !inputs.stage_tested_draft && !inputs.native_only && !inputs.run_laya && !inputs.run_xtts && !inputs.run_laya_windows && !inputs.managed_model_proof && !inputs.voice_device_proof && !inputs.assemble_tested_source }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: optional-embedding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated EmbeddingGemma runtime, not working Laya interpreter
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Optional-EmbeddingGemma-Runtime
          path: optional-embedding/embedding-runtime
          if-no-files-found: error
          retention-days: 7
  embedding-model:
    if: ${{ !inputs.stage_tested_draft && !inputs.native_only && !inputs.run_laya && !inputs.run_xtts && !inputs.run_laya_windows && !inputs.managed_model_proof && !inputs.voice_device_proof && !inputs.assemble_tested_source }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JARVIS_DATA_DIR: /tmp/jarvis-embedding-acceptance
      HF_HUB_DISABLE_TELEMETRY: '1'
      USE_TF: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned isolated CPU inference dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r optional-embedding/requirements.txt
          python -m pip check
      - name: Real pinned model, synthetic text/code/image/video/audio candidates
        run: python optional-embedding/acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-EmbeddingGemma-Real-CPU-Evidence
          path: embedding-evidence
          if-no-files-found: error
          retention-days: 7

  stage-draft:
    if: ${{ inputs.stage_tested_draft && !inputs.managed_model_proof && !inputs.voice_device_proof && !inputs.assemble_tested_source }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: prithiviiraj/jarvis
      TAG: v0.4.0-tested-20261009-a77b5bc
    steps:
      - name: Verify exact successful build and existing draft
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = prithiviiraj/jarvis
          gh api repos/$GH_REPO/actions/runs/37846295862 > run.json
          jq -e '.conclusion=="success" and .head_sha=="a77b5bc4ba09b6c0c2f242b26678798ac33de5e4"' run.json
          gh release view "$TAG" --json isDraft,isPrerelease,tagName > release.json
          jq -e '.isDraft==true and .isPrerelease==true and .tagName=="v0.4.0-tested-20261009-a77b5bc"' release.json
          gh release edit "$TAG" --target a77b5bc4ba09b6c0c2f242b26678798ac33de5e4 --draft --prerelease
      - name: Download original verified portable ZIP without repacking
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/artifacts/11581859310 > artifact.json
          jq -e '.workflow_run.id==37846295862 and .name=="JARVIS-Windows-Voice-Preview" and .expired==false' artifact.json
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/$GH_REPO/actions/artifacts/11581859310/zip -o JARVIS-tested-build-a77b5bc.zip
          printf '%s  %s\n' 12e16a6f0ce69a5129ac9b8888023f5f49081c41d5e8894076a6b866832e0a81 JARVIS-tested-build-a77b5bc.zip | sha256sum --check
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('JARVIS-tested-build-a77b5bc.zip') as z:
              assert z.testzip() is None
              assert all(n in z.namelist() for n in ['JARVIS.exe','backend/jarvis-local-core.exe','embedding-runtime/jarvis-embedding.exe','START HERE.txt','licenses/JARVIS-corresponding-application-source.tar.gz'])
          PY
      - name: Attach original ZIP to draft only and verify
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft | jq -e '.isDraft==true'
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq JARVIS-tested-build-a77b5bc.zip; then
            echo 'Asset already exists; refusing duplicate or replacement'
            exit 1
          fi
          gh release upload "$TAG" JARVIS-tested-build-a77b5bc.zip
          gh release view "$TAG" --json isDraft,isPrerelease,assets,url > staged.json
          jq -e '.isDraft==true and .isPrerelease==true and any(.assets[]; .name=="JARVIS-tested-build-a77b5bc.zip" and .size==1364917105)' staged.json
          cat staged.json
  managed-model-proof:
    if: ${{ inputs.managed_model_proof && !inputs.stage_tested_draft && !inputs.assemble_tested_source }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve exact LF source bytes on Windows checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage bounded diagnostic-only changed-image source
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('src/jarvis/changed_image_latency.py',[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('modern-ui/changed-image-proof.py',[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('tests/test_changed_image_latency.py',[Convert]::FromBase64String(''))
      - name: Verify expanded managed model source is tracked
        shell: pwsh
        run: |
          git ls-files --error-unmatch src/jarvis/managed_runtime.py src/jarvis/managed_session.py src/jarvis/model_probe.py modern-ui/managed-model-proof.py
          if ($LASTEXITCODE -ne 0) { throw 'Expanded managed source missing; do not apply an older patch' }
          python -m compileall -q src/jarvis modern-ui/managed-model-proof.py
          if ($LASTEXITCODE -ne 0) { throw 'Managed diagnostic source compilation failed' }
      - name: Install diagnostic image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Expanded source backend regression before model downloads
        shell: pwsh
        run: |
          python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2
          if ($LASTEXITCODE -ne 0) { throw 'Backend diagnostic dependencies failed' }
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw 'Expanded source backend regression failed' }
      - name: Changed-frame equal-quality before/after diagnostic
        shell: pwsh
        run: |
          python modern-ui/changed-image-proof.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual managed model proof failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-managed-model-diagnostic-evidence
          path: managed-proof-evidence
          retention-days: 7
          if-no-files-found: error
  assemble-tested-source:
    if: ${{ inputs.assemble_tested_source && !inputs.stage_tested_draft && !inputs.managed_model_proof && !inputs.voice_device_proof && github.ref == 'refs/heads/jarvis-bigfoot-integration' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-bigfoot-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify scope and pinned product patches
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_REPOSITORY" = prithiviiraj/jarvis
          test "$GITHUB_REF" = refs/heads/jarvis-bigfoot-integration
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf '%s  %s\n' 'c78abbba6649e7545329e795d1e6a257f8114071a6b82c7a037e0a3727025d21' '1-JARVIS-native-workarea.patch' | sha256sum --check
          git ls-files --error-unmatch src/jarvis/managed_session.py src/jarvis/model_probe.py modern-ui/managed-model-proof.py
          git apply --check 1-JARVIS-native-workarea.patch
          git apply --index 1-JARVIS-native-workarea.patch
          git diff --cached --name-only > /tmp/product-paths.txt
          python - <<'PY'
          import pathlib
          names=pathlib.Path('/tmp/product-paths.txt').read_text().splitlines()
          allowed=('src/jarvis/','tests/','modern-ui/','third-party/bigfoot/')
          assert names and all(n.startswith(allowed) for n in names), names
          assert not any(n.startswith(('.github/','docs/')) or n.endswith(('.exe','.zip','.patch')) for n in names), names
          PY
      - name: Actual assembled backend regression
        run: |
          python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0
          PYTHONPATH=src python -m unittest discover -s tests
      - name: Commit only tested integration product source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/jarvis-bigfoot-integration | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble tested microphone responsive speech and owned-route follow-up'
          git push origin HEAD:refs/heads/jarvis-bigfoot-integration
  voice-device-proof:
    if: ${{ inputs.voice_device_proof && !inputs.managed_model_proof && !inputs.native_only && !inputs.stage_tested_draft && !inputs.assemble_tested_source }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Preserve LF diagnostic bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage pinned actual Tamil model and decoding comparison
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('modern-ui/tamil-stt-proof.py',[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('modern-ui/whisper-small-proof.json',[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('modern-ui/tamil-fixtures-proof.json',[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('modern-ui/build-stt-proof.ps1',[Convert]::FromBase64String(''))
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build pinned actual CPU speech runtime
        shell: pwsh
        working-directory: modern-ui
        run: |
          python -m pip install scipy==1.16.2 certifi==2026.7.22 tzdata==2025.2 numpy==2.2.6
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic dependencies failed' }
          ./build-stt-proof.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned STT runtime build failed' }
      - name: Actual base small beam1 beam5 Tamil Auto matrix
        shell: pwsh
        working-directory: modern-ui
        run: |
          python tamil-stt-proof.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Tamil matrix failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-Tamil-STT-diagnostic-evidence
          path: modern-ui/tamil-stt-evidence
          retention-days: 7
          if-no-files-found: error
