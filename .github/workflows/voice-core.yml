name: JARVIS Phase1 experimental source checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned array dependency for worker tests
        run: python -m pip install numpy==2.2.6
      - name: Pure source and OS credential tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          $env:JARVIS_DATA_DIR = "$PWD\ci-data"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
          python -m jarvis --check
          if ($LASTEXITCODE -ne 0) { throw 'Foundation check failed' }
      - name: Real Windows SAPI synthetic file, no physical output claim
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python packaging/sapi_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows SAPI smoke failed' }
      - name: Source preview window, no sensors
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          $env:PYTHONPATH = "$PWD\src"
          python packaging/preview_smoke.py "$PWD\voice-preview.png"
          if ($LASTEXITCODE -ne 0) { throw 'Source preview failed' }
      - name: Verify pinned downloads and real STT/VAD fixture inference
        shell: pwsh
        run: |
          python -m pip download --no-deps faster-whisper==1.2.1 --dest pcm-input
          if ($LASTEXITCODE -ne 0) { throw 'Pinned input download failed' }
          python packaging/stt/build_pcm_fork.py pcm-input/faster_whisper-1.2.1-py3-none-any.whl pcm-wheel
          if ($LASTEXITCODE -ne 0) { throw 'PCM fork failed' }
          python -m pip install -r packaging/stt/requirements-pcm.txt pcm-wheel/faster_whisper-1.2.1-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw 'Experimental dependency installation failed' }
          python packaging/stt/trim_evaluation_native.py
          if ($LASTEXITCODE -ne 0) { throw 'CPU native trim failed' }
          python -c "import sounddevice; sounddevice.query_devices(); import ctranslate2; assert 'int8' in ctranslate2.get_supported_compute_types('cpu')"
          if ($LASTEXITCODE -ne 0) { throw 'Trimmed native load failed' }
          $env:PYTHONPATH = "$PWD\src"
          python -c "import importlib.util; assert importlib.util.find_spec('av') is None, 'Unapproved PyAV present'"
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected PyAV dependency' }
          python packaging/voice_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'Speech fixture failed' }
          python -m pip freeze | Out-File voice-build-packages.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Phase1-PCM-source-evidence
          path: |
            voice-preview.png
            windows-voice-fixture.json
            voice-build-packages.txt
            native-trim-evaluation.json
          retention-days: 7
          if-no-files-found: error
