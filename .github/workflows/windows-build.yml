name: Build JARVIS voice Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed voice source bundle
        shell: pwsh
        working-directory: .
        run: Expand-Archive -Path 1-18-JARVIS-source-0.3.0.zip -DestinationPath .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Unit tests and desktop smoke
        run: |
          python -m unittest discover -s tests -v
          python tests/ui_smoke.py
      - name: Download pinned reviewed model assets
        run: python download_voice_model.py
      - name: Installed Windows voice enumeration
        run: python tests/windows_voice_smoke.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name JARVIS --collect-all PIL --collect-all customtkinter --collect-data cv2 --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all onnxruntime --collect-all sounddevice --collect-all av --hidden-import win32com.client --hidden-import pythoncom app.py
      - name: Prepare bundled model and EXE smoke
        shell: pwsh
        run: |
          Copy-Item config.example.json dist/JARVIS/config.json
          Copy-Item notes.example.txt dist/JARVIS/notes.txt
          Copy-Item models dist/JARVIS/models -Recurse
          Copy-Item THIRD_PARTY_NOTICES.md dist/JARVIS/THIRD_PARTY_NOTICES.md
          $env:JARVIS_SMOKE_TEST = '1'
          $env:JARVIS_SMOKE_OUTPUT = "$PWD\dist\smoke.png"
          $p = Start-Process -FilePath "$PWD\dist\JARVIS\JARVIS.exe" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id; throw 'EXE smoke timed out' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path dist/smoke.png)) { throw 'EXE smoke failed' }
          Remove-Item Env:JARVIS_SMOKE_TEST, Env:JARVIS_SMOKE_OUTPUT
      - name: Install installer compiler
        run: choco install innosetup --yes --no-progress
      - name: Build installable EXE
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compiler failed' }
          Get-FileHash installer-output/*.exe -Algorithm SHA256 | Format-List | Out-File installer-output/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Voice-0.3.0
          path: |
            jarvis/installer-output/*
            jarvis/dist/smoke.png
            jarvis/dist/windows-voices.json
          retention-days: 7
          if-no-files-found: error
