name: Build JARVIS Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed source bundle
        shell: pwsh
        working-directory: .
        run: |
          Expand-Archive -Path 18-JARVIS-source-0.2.0.zip -DestinationPath .
          $path = 'jarvis/app.py'
          $text = Get-Content $path -Raw
          $text = $text.Replace("root.geometry('1140x760'); root.minsize(940,660)", "root.geometry('%dx%d+20+20'%(min(1140,root.winfo_screenwidth()-40),min(760,root.winfo_screenheight()-100))); root.minsize(900,620)")
          $text = $text.Replace("root.update();ImageGrab.grab().save(os.environ['JARVIS_SMOKE_OUTPUT']);root.destroy()", "root.update();ImageGrab.grab(bbox=(root.winfo_rootx(),root.winfo_rooty(),root.winfo_rootx()+root.winfo_width(),root.winfo_rooty()+root.winfo_height())).save(os.environ['JARVIS_SMOKE_OUTPUT']);root.destroy()")
          Set-Content $path $text -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Unit tests and desktop smoke
        run: |
          python -m unittest discover -s tests -v
          python tests/ui_smoke.py
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name JARVIS --collect-all PIL --collect-all customtkinter --collect-data cv2 app.py
      - name: Prepare config and EXE smoke test
        shell: pwsh
        run: |
          Copy-Item config.example.json dist/JARVIS/config.json
          Copy-Item notes.example.txt dist/JARVIS/notes.txt
          $env:JARVIS_SMOKE_TEST = '1'
          $env:JARVIS_SMOKE_OUTPUT = "$PWD\dist\smoke.png"
          $p = Start-Process -FilePath "$PWD\dist\JARVIS\JARVIS.exe" -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id; throw 'EXE did not finish smoke test' }
          if ($p.ExitCode -ne 0) { throw 'EXE smoke failed' }
          if (-not (Test-Path dist/smoke.png)) { throw 'No rendered EXE screenshot' }
          Remove-Item Env:JARVIS_SMOKE_TEST, Env:JARVIS_SMOKE_OUTPUT
      - name: Install installer compiler
        run: choco install innosetup --yes --no-progress
      - name: Build installable EXE
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compiler failed' }
          Get-FileHash installer-output/*.exe -Algorithm SHA256 | Format-List | Out-File installer-output/SHA256.txt
      - name: Upload installer and smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-0.2.0
          path: |
            jarvis/installer-output/*
            jarvis/dist/smoke.png
          retention-days: 7
          if-no-files-found: error
