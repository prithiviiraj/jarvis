name: JARVIS modern Windows UI preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modern-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned frontend and real browser interactions
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          npm install --no-save playwright@1.51.1
          npx playwright install chromium
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory','dist' -PassThru
          try { node ui-smoke.mjs; if ($LASTEXITCODE -ne 0) { throw 'UI smoke failed' } } finally { Stop-Process -Id $server.Id }
      - name: Build Tauri Windows shell (no installer or backend)
        shell: pwsh
        run: |
          npm run tauri build -- --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Tauri shell failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-modern-UI-preview
          path: |
            modern-ui/ui-evidence
            modern-ui/dist
            modern-ui/src-tauri/target/release/jarvis-modern-ui.exe
          retention-days: 7
          if-no-files-found: error
