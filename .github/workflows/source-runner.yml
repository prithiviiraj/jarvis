name: JARVIS EXPERIMENTAL personal source runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned upstream and explicitly changed evaluation files
        shell: pwsh
        run: |
          git clone https://github.com/IgorSwat/Phonemis.git phonemis-upstream
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          Push-Location phonemis-upstream
          git checkout 71eb1ce33bd586d38cbac037843b8539d7829c3b
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source unavailable' }
          git apply ../packaging/phonemis/evaluation-fixes.patch
          if ($LASTEXITCODE -ne 0) { throw 'Exact patch failed' }
          Copy-Item ../packaging/phonemis/runner.cpp src/phonemis/main.cpp -Force
          Pop-Location
      - name: Native MSVC build and upstream regression tests
        shell: pwsh
        run: |
          cmake -S phonemis-upstream -B phonemis-upstream/build -DBUILD_RUNNER=ON -DBUILD_TESTS=ON -DCMAKE_CXX_FLAGS="/utf-8 /EHsc"
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build phonemis-upstream/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Push-Location phonemis-upstream
          & ./build/Release/phonemis_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Upstream tests failed' }
          Pop-Location
      - name: Real native UTF8 bridge synthetic text
        shell: pwsh
        run: |
          python packaging/phonemis/check.py
          if ($LASTEXITCODE -ne 0) { throw 'Native bridge failed' }
      - name: Source tests and bundled native frontend
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Test deps failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
          python packaging/source_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'Source bundle failed' }
      - name: Fresh Windows user setup via actual source runner
        shell: pwsh
        run: |
          python packaging/source_setup_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Fresh setup failed' }
      - name: Real workspace pixels after fresh setup
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python packaging/workspace_voice_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Workspace pixels failed' }
          Remove-Item source-runner/JARVIS-EXPERIMENTAL/.venv -Recurse -Force
          Remove-Item source-runner/JARVIS-EXPERIMENTAL/SETUP-OK.txt -ErrorAction SilentlyContinue
          Get-ChildItem source-runner/JARVIS-EXPERIMENTAL -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive -Path source-runner/JARVIS-EXPERIMENTAL -DestinationPath JARVIS-EXPERIMENTAL-Source-Runner.zip
          Get-FileHash JARVIS-EXPERIMENTAL-Source-Runner.zip -Algorithm SHA256 | Format-List | Out-File SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-EXPERIMENTAL-Source-Runner
          path: |
            JARVIS-EXPERIMENTAL-Source-Runner.zip
            SHA256.txt
            source-setup-check.json
            workspace-evidence
          retention-days: 7
          if-no-files-found: error
