name: JARVIS unified BrowserOS source regression
'on':
  workflow_dispatch: {}
  push:
    branches:
    - jarvis-voice-feedback-next
    paths:
    - .github/workflows/*unified-browseros-source.yml
permissions:
  contents: read
jobs:
  assemble-tested-source:
    if: ${{ github.ref == 'refs/heads/jarvis-voice-feedback-next' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: jarvis-voice-feedback-next
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Apply exact bounded unified source files
      run: "test \"$GITHUB_REPOSITORY\" = prithiviiraj/jarvis\ntest \"$GITHUB_REF\" = refs/heads/jarvis-voice-feedback-next\n\
        test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\npython - <<'PY'\nimport os,gzip,base64,pathlib,hashlib,json\n\
        raw=gzip.decompress(base64.b64decode(''.join(os.environ['SOURCE_'+str(i)]for i in range(16))))\nassert hashlib.sha256(raw).hexdigest()=='2d35bdc361e7d05a78c7da73bdfabb1db500ecb2456fd33de80c8b01b804e6fb'\n\
        files=json.loads(raw)\nassert set(files)=={'modern-ui/src/main.tsx', 'modern-ui/unified-smoke.mjs', 'tests/test_browseros_transport.py',\
        \ 'tests/test_browseros_controller.py', 'modern-ui/src/BrowserOSControl.tsx', 'modern-ui/unified-preview.mjs', 'modern-ui/src-tauri/src/main.rs',\
        \ 'src/jarvis/runtime.py', 'src/jarvis/local_arithmetic.py', 'modern-ui/src/unified.css', 'tests/test_local_arithmetic.py',\
        \ 'src/jarvis/browseros_controller.py', 'src/jarvis/ui_bridge.py', 'tests/test_bigfoot_native_diagnostic_contract.py',\
        \ 'src/jarvis/browseros_transport.py', 'modern-ui/src/LocalSetupControl.tsx', 'src/jarvis/workspace_voice.py'}\nfor\
        \ path,text in files.items():\n p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)\n\
        PY\ngit add src/jarvis/local_arithmetic.py src/jarvis/runtime.py src/jarvis/workspace_voice.py src/jarvis/browseros_transport.py\
        \ src/jarvis/browseros_controller.py src/jarvis/ui_bridge.py tests/test_local_arithmetic.py tests/test_browseros_transport.py\
        \ tests/test_browseros_controller.py tests/test_bigfoot_native_diagnostic_contract.py modern-ui/src/BrowserOSControl.tsx\
        \ modern-ui/src/LocalSetupControl.tsx modern-ui/src/main.tsx modern-ui/src/unified.css modern-ui/src-tauri/src/main.rs\
        \ modern-ui/unified-preview.mjs modern-ui/unified-smoke.mjs\n"
      env:
        EXPECTED_SHA: ${{ github.sha }}
        SOURCE_0: 
        SOURCE_1: 
        SOURCE_2: 
        SOURCE_3: 
        SOURCE_4: 
        SOURCE_5: 
        SOURCE_6: 
        SOURCE_7: 
        SOURCE_8: 
        SOURCE_9: 
        SOURCE_10: 
        SOURCE_11: 
        SOURCE_12: 
        SOURCE_13: 
        SOURCE_14: 
        SOURCE_15: 
    - name: Full backend regression
      run: 'python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0

        PYTHONPATH=src python -m unittest discover -s tests

        '
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Fresh settings return renderer regression
      run: 'cd modern-ui

        npm ci

        npm install --no-save playwright

        npx playwright install --with-deps chromium

        npm run build

        node unified-smoke.mjs

        node unified-preview.mjs

        '
    - name: Commit tested source only to isolated morning branch
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: 'test "$(git ls-remote origin refs/heads/jarvis-voice-feedback-next | cut -f1)" = "$EXPECTED_SHA"

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git commit -m ''Next unified first interface and reviewed BrowserOS adapter''

        git push origin HEAD:refs/heads/jarvis-voice-feedback-next

        '
