name: JARVIS unified BrowserOS source regression
'on':
  workflow_dispatch: {}
  push:
    branches:
    - jarvis-voice-feedback-next
    paths:
    - .github/workflows/*unified-browseros-source.yml
permissions:
  contents: read
jobs:
  assemble-tested-source:
    if: ${{ github.ref == 'refs/heads/jarvis-voice-feedback-next' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: jarvis-voice-feedback-next
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Apply exact bounded unified source files
      run: 'test "$GITHUB_REPOSITORY" = prithiviiraj/jarvis

        test "$GITHUB_REF" = refs/heads/jarvis-voice-feedback-next

        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        python - <<''PY''

        import os,gzip,base64,pathlib,hashlib,json

        raw=gzip.decompress(base64.b64decode(''''.join(os.environ[''SOURCE_''+str(i)]for i in range(1))))

        assert hashlib.sha256(raw).hexdigest()==''7fbf20dd26f41ca0df3516f38a02c23f678800da38293dd0427969801d42a88a''

        files=json.loads(raw)

        assert set(files)=={''tests/test_browseros_transport.py'', ''src/jarvis/browseros_transport.py''}

        for path,text in files.items():pathlib.Path(path).write_text(text,encoding=''utf-8'')

        PY

        git add src/jarvis/browseros_transport.py tests/test_browseros_transport.py

        '
      env:
        EXPECTED_SHA: ${{ github.sha }}
        SOURCE_0: 
    - name: Full backend regression
      run: 'python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0

        PYTHONPATH=src python -m unittest discover -s tests

        '
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Fresh settings return renderer regression
      run: 'cd modern-ui

        npm ci

        npm install --no-save playwright

        npx playwright install --with-deps chromium

        npm run build

        node unified-smoke.mjs

        node unified-preview.mjs

        '
    - name: Commit tested source only to isolated morning branch
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: 'test "$(git ls-remote origin refs/heads/jarvis-voice-feedback-next | cut -f1)" = "$EXPECTED_SHA"

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git commit -m ''Pin BrowserOS structured-output protocol negotiation''

        git push origin HEAD:refs/heads/jarvis-voice-feedback-next

        '
