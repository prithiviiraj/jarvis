name: JARVIS next navigation source regression
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  assemble-tested-source:
    if: ${{ github.ref == 'refs/heads/jarvis-voice-feedback-next' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: jarvis-voice-feedback-next
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Apply exact bounded morning product patch
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: 'test "$GITHUB_REPOSITORY" = prithiviiraj/jarvis

        test "$GITHUB_REF" = refs/heads/jarvis-voice-feedback-next

        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

        python - <<''PY''

        import gzip,base64,pathlib,hashlib

        raw=gzip.decompress(base64.b64decode(''''))

        assert hashlib.sha256(raw).hexdigest()==''27f9a261f24687888c3df7561e7dfc6549ca1eeef08773bd3c77da9b0ab6a517''

        pathlib.Path(''/tmp/morning-product.patch'').write_bytes(raw)

        PY

        git apply --check /tmp/morning-product.patch

        git apply --index /tmp/morning-product.patch

        git diff --cached --name-only > /tmp/paths.txt

        python - <<''PY''

        import pathlib

        names=pathlib.Path(''/tmp/paths.txt'').read_text().splitlines()

        assert len(names)==9

        assert all(n.startswith((''src/jarvis/'',''tests/'',''modern-ui/'',''third-party/beautiful-ui/''))for n in names)

        assert not any(''ui-evidence/''in n or n.endswith((''.exe'',''.zip''))for n in names)

        PY

        '
    - name: Full backend regression before source commit
      run: 'python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0

        PYTHONPATH=src python -m unittest discover -s tests

        '
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Fresh settings return renderer regression
      run: 'cd modern-ui

        npm ci

        npm install --no-save playwright

        npx playwright install --with-deps chromium

        npm run build

        node settings-return-smoke.mjs

        node bigfoot-morning-smoke.mjs

        '
    - name: Commit tested source only to isolated morning branch
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: 'test "$(git ls-remote origin refs/heads/jarvis-voice-feedback-next | cut -f1)" = "$EXPECTED_SHA"

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git commit -m ''Next iteration settings return and diagnostic hardening''

        git push origin HEAD:refs/heads/jarvis-voice-feedback-next

        '
