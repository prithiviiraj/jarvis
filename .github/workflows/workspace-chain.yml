name: JARVIS five-voice workspace software chain
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned upstream and explicitly changed evaluation files
        shell: pwsh
        run: |
          git clone https://github.com/IgorSwat/Phonemis.git phonemis-upstream
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          Push-Location phonemis-upstream
          git checkout 71eb1ce33bd586d38cbac037843b8539d7829c3b
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source unavailable' }
          git apply ../packaging/phonemis/evaluation-fixes.patch
          if ($LASTEXITCODE -ne 0) { throw 'Exact patch failed' }
          Copy-Item ../packaging/phonemis/runner.cpp src/phonemis/main.cpp -Force
          Pop-Location
      - name: Native MSVC build and upstream regression tests
        shell: pwsh
        run: |
          cmake -S phonemis-upstream -B phonemis-upstream/build -DBUILD_RUNNER=ON -DBUILD_TESTS=ON -DCMAKE_CXX_FLAGS="/utf-8 /EHsc"
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          cmake --build phonemis-upstream/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Push-Location phonemis-upstream
          & ./build/Release/phonemis_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Upstream tests failed' }
          Pop-Location
      - name: Real native UTF8 bridge synthetic text
        shell: pwsh
        run: |
          python packaging/phonemis/check.py
          if ($LASTEXITCODE -ne 0) { throw 'Native bridge failed' }
      - name: Real isolated native frontend to Kokoro WAV, candidate only
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -m pip install numpy==2.2.6 onnxruntime==1.23.2
          if ($LASTEXITCODE -ne 0) { throw 'Candidate dependencies failed' }
          python packaging/phonemis/synthesis_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate synthesis failed' }
      - name: Actual PCM STT to synthetic localhost SSE to candidate waveform
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -m pip download --no-deps faster-whisper==1.2.1 --dest pcm-input
          if ($LASTEXITCODE -ne 0) { throw 'Input wheel failed' }
          python packaging/stt/build_pcm_fork.py pcm-input/faster_whisper-1.2.1-py3-none-any.whl pcm-wheel
          if ($LASTEXITCODE -ne 0) { throw 'PCM fork failed' }
          python -m pip install -r packaging/stt/requirements-pcm.txt pcm-wheel/faster_whisper-1.2.1-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { throw 'Loop dependency failed' }
          python -c "import importlib.util; assert importlib.util.find_spec('av') is None"
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected av' }
          python packaging/voice_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'Speech fixture failed' }
          python packaging/phonemis/loop_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Software loop failed' }
      - name: Five actual voices through workspace runtime factory
        shell: pwsh
        env:
          PYTHONPATH: src
          JARVIS_DATA_DIR: ci-workspace-data
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          python packaging/workspace_chain.py
          if ($LASTEXITCODE -ne 0) { throw 'Workspace software chain failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-five-voice-software-chain-only
          path: |
            workspace-chain-evidence
            phonemis-windows.json
            kokoro-windows.json
            candidate-loop.json
          retention-days: 7
          if-no-files-found: error
