name: JARVIS NEXT unified full shipping candidate
'on':
  push:
    branches:
    - jarvis-voice-feedback-next
    paths:
    - .github/workflows/2-unified-full-shipping.yml
permissions:
  contents: read
  actions: read
jobs:
  embedding-runtime:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: optional-embedding
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 8a444bf76ba866cd5bb865c17bc1e454e109ad7b
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build isolated EmbeddingGemma runtime, not working Laya interpreter
      shell: pwsh
      run: ./build-windows.ps1
    - uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Optional-EmbeddingGemma-Runtime
        path: optional-embedding/embedding-runtime
        if-no-files-found: error
        retention-days: 7
  windows:
    needs: embedding-runtime
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: modern-ui
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 8a444bf76ba866cd5bb865c17bc1e454e109ad7b
    - working-directory: ${{ github.workspace }}
      name: Apply exact tested unified shipping source and whole native fixtures
      shell: python
      env:
        PATCH_0: 
        PATCH_1: 
        PATCH_2: 
        PATCH_3: 
        PATCH_4: 
        PATCH_5: 
        PATCH_6: 
      run: "import os,base64,gzip,json,pathlib,hashlib\nraw=gzip.decompress(base64.b64decode(''.join(os.environ['PATCH_'+str(i)]for i in range(7))))\nassert hashlib.sha256(raw).hexdigest()=='0f7d7c1df88d03dec6ab1d299e3c7f0b9c4fa44e46a11589aa665cf7b5baf8b8'\nfor name,text in json.loads(raw).items():\n p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')\n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install required Brave browser for real frozen navigation acceptance
      shell: pwsh
      run: 'Invoke-WebRequest ''https://github.com/brave/brave-browser/releases/download/v1.88.134/BraveBrowserStandaloneSilentSetup.exe'' -OutFile ''brave-host-setup.exe''

        if ((Get-FileHash ''brave-host-setup.exe'' -Algorithm SHA256).Hash.ToLowerInvariant() -ne ''cfc5aacc652d85138d51572a7914253b17cea055da26ab51b844255cd38f2d68'') { throw ''Pinned Brave host installer hash mismatch'' }

        $sig = Get-AuthenticodeSignature ''brave-host-setup.exe''

        if ($sig.Status -ne ''Valid'' -or $sig.SignerCertificate.Subject -notmatch ''Brave Software'') { throw ''Brave host installer signature invalid'' }

        $install = Start-Process (Resolve-Path ''brave-host-setup.exe'').Path -Wait -PassThru

        if ($install.ExitCode -notin @(0,3010)) { throw ''Pinned Brave host install failed'' }

        $env:PYTHONPATH = (Resolve-Path ''../src'').Path

        python -c "from jarvis.brave_path import find_brave; print(''Verified Brave executable:'', find_brave())"

        if ($LASTEXITCODE -ne 0) { throw ''Installed Brave host not found'' }

        $env:PYTHONPATH = ''''

        '
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Backend tests
      shell: pwsh
      run: 'python -m pip install numpy==2.2.6 certifi==2026.7.22 tzdata==2025.2 Pillow==11.3.0

        if ($LASTEXITCODE -ne 0) { throw "Test dependencies failed" }

        $env:PYTHONPATH="../src"

        python -m unittest discover -s ../tests

        if ($LASTEXITCODE -ne 0) { throw "Backend tests failed" }

        '
    - name: ALL unified renderer and reviewed feature regressions
      shell: pwsh
      run: 'npm ci

        if ($LASTEXITCODE -ne 0) { throw ''Install failed'' }

        npm run build

        if ($LASTEXITCODE -ne 0) { throw ''Frontend build failed'' }

        npm install --no-save playwright@1.56.0

