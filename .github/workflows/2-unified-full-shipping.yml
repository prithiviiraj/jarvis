    - name: New conductor handoff acceptance
      shell: pwsh
      run: 'python -m pip install playwright==1.56.0

        python -m playwright install chromium

        $env:PYTHONPATH=''../src''

        python actual-news-capture.py

        if ($LASTEXITCODE -ne 0) { throw ''Actual browser news capture failed'' }

        '
    - name: Actual Obsidian native Canvas fixture
      shell: pwsh
      run: 'python -m pip install playwright==1.56.0

        python obsidian-host-smoke.py

        if ($LASTEXITCODE -ne 0) { throw ''Actual Obsidian Canvas host failed'' }

        '
    - name: Build Tauri Windows executable
      shell: pwsh
      run: 'if (Test-Path ''src-tauri/target'') { Remove-Item -Recurse -Force ''src-tauri/target'' }

        python -m pip install Pillow==11.3.0 pywinauto==0.6.9

        Set-Location ..

        python packaging/game_capture_smoke.py

        if ($LASTEXITCODE -ne 0) { throw ''Synthetic game-window capture failed'' }

        Set-Location modern-ui

        python make-icon.py

        npm run tauri build -- --no-bundle

        if ($LASTEXITCODE -ne 0) { throw ''Tauri shell failed'' }

        python -m pip install Pillow==11.3.0 pywinauto==0.6.9

        '
    - name: CPU-only speech and native persona frontend
      shell: pwsh
      run: './build-mp3.ps1

        if ($LASTEXITCODE -ne 0) { throw ''Pinned MP3 encoder source build failed'' }

        ./build-speech-native.ps1

        '
    - name: Download isolated EmbeddingGemma runtime for bundled delivery
      uses: actions/download-artifact@v4
      with:
        name: JARVIS-Optional-EmbeddingGemma-Runtime
        path: modern-ui/embedding-runtime
    - name: Package bundled local core and test the portable EXE
      shell: pwsh
      env:
        JARVIS_PACKAGE_VOICE: '1'
        JARVIS_BUNDLE_MODELS: '1'
      run: 'python -m pip install pyinstaller==6.16.0 opencv-python==4.12.0.88 playwright==1.56.0

        if ($LASTEXITCODE -ne 0) { throw ''Packaging dependencies failed'' }

        python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

        if ($LASTEXITCODE -ne 0) { throw ''Inbuilt Laya CPU Torch failed'' }

        python -m pip install -r ../optional-laya/requirements.txt

        python -m pip install model2vec==0.9.0

        if ($LASTEXITCODE -ne 0) { throw ''Inbuilt Laya runtime dependencies failed'' }

        python prepare-bundled-models.py

        if ($LASTEXITCODE -ne 0) { throw ''Pinned bundled weights failed integrity/license preparation'' }

        python package-windows.py

        if ($LASTEXITCODE -ne 0) { throw ''Frozen core acceptance failed'' }

        '
    - name: Preserve full built package for diagnostic acceptance retries
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-FULL-PACKAGE-DIAGNOSTIC-NOT-ACCEPTED
        path: modern-ui/windows-portable/
        retention-days: 2
        if-no-files-found: error
    - name: Match baseline installed Obsidian host prerequisite
      shell: pwsh
      run: 'New-Item -ItemType Directory -Force ui-evidence | Out-Null

        python -m pip install playwright==1.56.0

        if ($LASTEXITCODE -ne 0) { throw ''Obsidian host fixture dependency failed'' }

        python obsidian-host-smoke.py

        if ($LASTEXITCODE -ne 0) { throw ''Actual installed Obsidian host prerequisite failed'' }

        '
    - name: Accept actual portable native UI and frozen software runtimes
      shell: pwsh
      run: '$env:JARVIS_UI_EXE = (Resolve-Path ''windows-portable/JARVIS.exe'').Path

        $env:PYTHONPATH = ''''

        python native-smoke.py

        if ($LASTEXITCODE -ne 0) { throw ''Packaged Tauri launch failed'' }

        python unified-native-smoke.py

        if ($LASTEXITCODE -ne 0) { throw ''Unified candidate native UI failed'' }

        python desktop-native-proof.py

        if ($LASTEXITCODE -ne 0) { throw ''Actual desktop proof failed'' }

        & ./windows-portable/backend/jarvis-local-core.exe --groq-stt-self-test

        if ($LASTEXITCODE -ne 0) { throw ''Frozen Groq keyless request contract failed'' }

        & ./windows-portable/backend/jarvis-local-core.exe --voice-self-test

        if ($LASTEXITCODE -ne 0) { throw ''Frozen speech software chain failed'' }

        & ./windows-portable/backend/jarvis-local-core.exe --phone-self-test

        if ($LASTEXITCODE -ne 0) { throw ''Frozen private phone software chain failed'' }

        & ./windows-portable/backend/jarvis-local-core.exe --laya-self-test

        if ($LASTEXITCODE -ne 0) { throw ''Frozen managed Laya acceptance failed'' }

        & ./windows-portable/backend/jarvis-local-core.exe --turn-self-test

        if ($LASTEXITCODE -ne 0) { throw ''Frozen Smart Turn acceptance failed'' }

        & ./windows-portable/backend/jarvis-local-core.exe --search-self-test

        if ($LASTEXITCODE -ne 0) { throw ''Frozen English search acceptance failed'' }

        '
    - name: Actual pinned BrowserOS neo Windows isolated navigation
      shell: pwsh
      run: './install-browseros-native.ps1

        '
      if: always()
    - name: Exact candidate managed model synthetic software diagnostics, NOT ownerGPU speed
      shell: pwsh
      run: '$env:JARVIS_CORE_EXE = (Resolve-Path ''windows-portable/backend/jarvis-local-core.exe'').Path

        $env:JARVIS_DATA_DIR = (Join-Path (Get-Location) ''candidate-managed-proof-data'')

        python owner-speed-proof.py

        if ($LASTEXITCODE -ne 0) { throw ''Exact candidate owner speed command failed'' }

